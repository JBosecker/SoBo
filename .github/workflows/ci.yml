name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sobo/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: backend
      - name: Dependencies
        run: |
          # uv installs Python 3.13 itself (as in the image), no setup-python needed
          uv venv -p 3.13
          uv pip install -e ".[dev]" pip-audit
      - name: ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: uv run pytest -p anyio -q
      - name: pip-audit
        run: uv run pip-audit --skip-editable

  guest-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: guest-page
      - name: Guest page built and up to date?
        run: python3 scripts/build_guest_page.py --check
      - name: Browser tests (Playwright/Chromium)
        working-directory: sobo/backend
        run: |
          uv venv -p 3.13
          uv pip install -e ".[dev,browser]"
          uv run playwright install --with-deps chromium
          uv run pytest -p anyio -q -m browser

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: integration
      - name: Dependencies
        run: |
          uv venv -p 3.14
          uv pip install -r requirements_test.txt ruff
      - name: ruff
        run: |
          uv run ruff check custom_components tests scripts
          uv run ruff format --check custom_components tests scripts
      - name: pytest
        run: uv run pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS loads hacs.json/manifest.json without authentication – always red for a private repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The icon in the home-assistant/brands repository follows with the release
          ignore: brands

  app-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check app configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: "./sobo"

  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix (amd64 and aarch64 on native runners)
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: sobo
          registry-prefix: ghcr.io/jbosecker

  build:
    name: Build ${{ matrix.arch }}
    needs: [backend, app-config, build-matrix]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Version from config.yaml
        id: version
        run: |
          version="$(grep -E '^version:' sobo/config.yaml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build image (without push)
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./sobo
          image: ${{ matrix.image }}
          image-tags: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            io.hass.type=app
            io.hass.name=SoBo
            io.hass.description=Sonos jukebox as a Home Assistant app
            io.hass.url=https://github.com/JBosecker/SoBo
          push: "false"
          # Signing only once images are published (release, phase 6)
          cosign: "false"
