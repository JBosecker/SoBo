<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoBo</title>
<!-- Platzhalter bis zur Admin-SPA (Phase 3): zeigt den Live-Zustand. -->
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --muted:#6b6b76; --bg:#fafafa; --card:#fff; --line:#e4e4ea; --accent:#0a7c66; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ececf1; --muted:#9a9aa6; --bg:#111114; --card:#1b1b20; --line:#2c2c33; --accent:#3ccfab; } }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:16px 0; }
  .state { display:inline-block; padding:2px 10px; border-radius:99px; border:1px solid var(--line); font-size:13px; }
  ol { margin:0; padding-left:22px; }
  li { margin:4px 0; }
  .votes { color:var(--accent); font-variant-numeric:tabular-nums; }
  button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Hello SoBo</h1>
  <div class="muted">Sonos-Jukebox · Zustand: <span id="state" class="state">…</span></div>
  <div class="card">
    <div class="muted">Läuft gerade</div>
    <div id="now">–</div>
    <div class="muted" style="margin-top:8px">Als Nächstes</div>
    <div id="next">–</div>
  </div>
  <div class="card">
    <div class="muted">Warteschlange</div>
    <ol id="queue"></ol>
  </div>
  <div class="card">
    <button id="toggle">Jukebox an/aus</button>
    <button id="skip">Überspringen</button>
    <span id="msg" class="muted"></span>
  </div>
</main>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  let active = false;
  function label(item) { return item ? `${item.artist} – ${item.title}` : "–"; }
  async function refresh() {
    try {
      const res = await fetch("api/status");
      const s = await res.json();
      active = s.active;
      $("state").textContent = s.state + (s.last_error ? ` (${s.last_error})` : "");
      $("now").textContent = label(s.now_playing);
      $("next").textContent = label(s.next);
      const list = $("queue");
      list.replaceChildren(...s.queue.map((item) => {
        const li = document.createElement("li");
        const votes = document.createElement("span");
        votes.className = "votes";
        votes.textContent = `▲${item.votes} `;
        li.append(votes, label(item), item.submitted_by ? ` · ${item.submitted_by}` : "");
        return li;
      }));
      $("msg").textContent = "";
    } catch (err) {
      $("msg").textContent = "Keine Verbindung";
    }
  }
  async function post(path, body) {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (!res.ok) { $("msg").textContent = `Fehler ${res.status}`; }
    refresh();
  }
  $("toggle").addEventListener("click", () => post("api/jukebox", { active: !active }));
  $("skip").addEventListener("click", () => post("api/skip"));
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
