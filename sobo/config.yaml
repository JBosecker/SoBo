name: SoBo
version: "0.1.3"
image: ghcr.io/jbosecker/sobo
slug: sobo
description: Sonos party jukebox – guests suggest and vote for songs via QR code
url: https://github.com/JBosecker/SoBo
arch:
  - aarch64
  - amd64
init: false
# SSDP discovery of the Sonos speakers needs the host network (plan 4.2).
# No `ports:` mapping: admin only via ingress, guests only via the integration.
host_network: true
ingress: true
ingress_port: 8737
panel_icon: mdi:music-box-multiple
panel_title: SoBo
# panel_admin defaults to true: only HA admins see the panel (plan 6).

# Only for the Supervisor discovery (pairing with the integration, plan 3.3).
hassio_api: true
discovery:
  - sobo
options:
  log_level: info
  fake_sonos: false
schema:
  log_level: list(trace|debug|info|warning|error)?
  fake_sonos: bool?
