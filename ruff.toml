# Integration (custom_components/), deren Tests (tests/) und Skripte.
# Das Backend hat eigene Einstellungen in sobo/backend/pyproject.toml.
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "ASYNC109"]

[lint.isort]
known-first-party = ["custom_components"]

[lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
